name: Update Room Scene

on:
  schedule:
    - cron: '0 0 * * *'   # 北京 08:00 早晨
    - cron: '0 10 * * *'  # 北京 18:00 傍晚
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select preset
        id: gen
        run: python3 .github/scripts/select_room.py

      - name: Point README at the preset
        env:
          SLOT: ${{ steps.gen.outputs.slot }}
        run: python3 .github/scripts/update_room_readme.py

      - name: Install image tools
        run: python3 -m pip install --quiet pillow

      - name: Regenerate hero banners from the full scenes
        run: python3 .github/scripts/make_banner.py --both

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/room/*-banner.webp
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh room scene (${{ steps.gen.outputs.slot }})"
            git push
          fi
